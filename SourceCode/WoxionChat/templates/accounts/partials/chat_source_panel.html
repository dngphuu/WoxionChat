<!-- Bảng điều khiển bên trái: Đoạn chat & Tài liệu nguồn -->
<div class="source-panel">
    <h2 class="source-header">
        <span class="source-title-text"><i class="fas fa-layer-group me-2" style="color:#10a37f;"></i>Hội thoại & Tài liệu</span>
        <button class="collapse-btn" style="color: #10a37f;" onclick="toggleSourcePanel()" title="Thu gọn / Mở rộng">
            <i class="fas fa-chevron-left"></i>
        </button>
    </h2>

    <!-- Navigation Tabs: Đoạn chat vs Tài liệu -->
    <div class="sidebar-nav-tabs">
        <button class="sidebar-tab-btn active" data-tab="threads" onclick="switchSidebarTab('threads')">
            <i class="far fa-comments"></i> Đoạn chat
        </button>
        <button class="sidebar-tab-btn" data-tab="documents" onclick="switchSidebarTab('documents')">
            <i class="far fa-file-alt"></i> Tài liệu
        </button>
    </div>

    <!-- View 1: Danh sách các cuộc trò chuyện -->
    <div id="sidebarThreadsView" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
        <button class="btn-new-chat" onclick="ChatThreads.createThread('Cuộc trò chuyện mới', true)">
            <i class="fas fa-plus"></i> Cuộc trò chuyện mới
        </button>
        <div class="threads-container" id="threadsContainer">
            <!-- Rendered by chat_threads.js -->
        </div>
    </div>

    <!-- View 2: Danh sách tài liệu cá nhân -->
    <div id="sidebarDocumentsView" style="display: none; flex-direction: column; flex: 1; min-height: 0; padding: 0 10px;">
        <div class="source-item" id="userDatabaseList" style="flex: 1; overflow-y: auto;">
            <div class="loading-indicator" id="loadingIndicator">
                <i class="fas fa-spinner fa-spin"></i> Đang tải dữ liệu...
            </div>
        </div>
        <div class="source-actions" style="margin-top: 8px;">
            <button class="btn-refresh" onclick="loadUserDatabase()" style="width: 100%;">
                <i class="fas fa-sync-alt"></i> Làm mới tài liệu
            </button>
        </div>
    </div>
</div>
